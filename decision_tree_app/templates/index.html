<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Tree Prediction</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">Decision Tree Predictor</h2>
        <form id="predictForm" class="row g-3">
          <div class="col-md-6">
            <input
              type="number"
              step="any"
              class="form-control"
              name="sepal_length"
              placeholder="Sepal Length"
              required
            />
          </div>
          <div class="col-md-6">
            <input
              type="number"
              step="any"
              class="form-control"
              name="sepal_width"
              placeholder="Sepal Width"
              required
            />
          </div>
          <div class="col-md-6">
            <input
              type="number"
              step="any"
              class="form-control"
              name="petal_length"
              placeholder="Petal Length"
              required
            />
          </div>
          <div class="col-md-6">
            <input
              type="number"
              step="any"
              class="form-control"
              name="petal_width"
              placeholder="Petal Width"
              required
            />
          </div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-success mt-3">Predict</button>
          </div>
        </form>
        <div class="text-center mt-4" id="result"></div>
      </div>
      <p class="text-center text-muted mt-3">
        Powered by FastAPI & Scikit-learn
      </p>
    </div>

    <script>
      const form = document.getElementById("predictForm");
      const resultDiv = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault(); // Prevent page reload

        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => {
          data[key] = parseFloat(value);
        });

        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          const json = await response.json();
          resultDiv.innerHTML = `
    <h4 class="text-success">Flower Type: ${json.flower}</h4>
    <p class="text-muted">Class ID: ${json.class}</p>
`;
        } catch (err) {
          resultDiv.innerHTML = `<h4 class="text-danger">Error: ${err}</h4>`;
        }
      });
    </script>
  </body>
</html>
